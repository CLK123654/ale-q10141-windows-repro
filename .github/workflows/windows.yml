name: windows-2025

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install SQLite3.51.2
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP sqlite-tools-win-x64-3510200.zip
          $destination = Join-Path $env:RUNNER_TEMP sqlite-3.51.2
          Invoke-WebRequest -Uri https://sqlite.org/2026/sqlite-tools-win-x64-3510200.zip -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $sqlite = Get-ChildItem -Path $destination -Filter sqlite3.exe -Recurse | Select-Object -First 1
          if (-not $sqlite) { throw 'sqlite3.exe not found' }
          $version = & $sqlite.FullName --version
          if (-not $version.StartsWith('3.51.2')) { throw "Unexpected SQLite version: $version" }
          "SQLITE3_PATH=$($sqlite.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run independent verification
        shell: pwsh
        run: npm run verify

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q10141-windows-evidence
          path: verification/evidence/
          if-no-files-found: error
          retention-days: 1
